<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>五代十国 · 乱世星图（知识图谱）</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚔️</text></svg>">
<style>
:root{
  --bg:#05070f; --card:rgba(13,17,31,.78); --line:rgba(130,150,255,.16);
  --txt:#e9edff; --dim:#8d95b9;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--txt);font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Source Han Sans SC",sans-serif;-webkit-font-smoothing:antialiased}
#c{position:fixed;inset:0;display:block;cursor:grab;touch-action:none}
#c.grabbing{cursor:grabbing}
#vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 52%,rgba(2,4,10,.6) 100%)}

/* ===== 标题 ===== */
.brand{position:fixed;top:20px;left:24px;pointer-events:none;z-index:5}
.brand h1{font-family:"Kaiti SC","STKaiti","KaiTi","Noto Serif SC",serif;font-size:34px;font-weight:700;letter-spacing:2px;background:linear-gradient(92deg,#ff5d73 0%,#f472b6 30%,#a78bfa 65%,#2dd4bf 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 16px rgba(167,139,250,.35))}
.brand h1 small{font-size:16px;letter-spacing:5px;background:none;-webkit-text-fill-color:#cbd5ff;filter:none}
.brand p{margin-top:6px;font-size:12.5px;color:var(--dim);letter-spacing:1.5px}

/* ===== 图例 ===== */
.legend{position:fixed;top:96px;left:24px;display:flex;flex-wrap:wrap;gap:8px;z-index:5;max-width:62vw}
.lg{display:flex;align-items:center;gap:7px;padding:6px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:var(--txt);font-size:12.5px;cursor:pointer;transition:.25s;user-select:none;font-family:inherit}
.lg:hover{border-color:rgba(140,160,255,.45);transform:translateY(-1px)}
.lg .dot{width:9px;height:9px;border-radius:50%;box-shadow:0 0 8px var(--c)}
.lg.off{opacity:.32;filter:grayscale(.8)}
.lg .cnt{color:var(--dim);font-size:11px}

/* ===== 搜索 ===== */
.search{position:fixed;top:20px;right:24px;z-index:6;width:250px}
.search input{width:100%;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);color:var(--txt);font-size:13.5px;outline:none;transition:.25s;font-family:inherit}
.search input:focus{border-color:rgba(45,212,191,.6);box-shadow:0 0 0 3px rgba(45,212,191,.12),0 0 22px rgba(45,212,191,.15)}
.search input::placeholder{color:#5c6485}
.search .list{position:absolute;top:calc(100% + 8px);left:0;right:0;border-radius:12px;background:rgba(10,13,25,.95);border:1px solid var(--line);overflow:hidden;max-height:280px;overflow-y:auto;display:none;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);z-index:9}
.search .list.show{display:block}
.sitem{display:flex;align-items:center;gap:8px;padding:9px 12px;cursor:pointer;font-size:13px}
.sitem:hover{background:rgba(120,140,255,.12)}
.sitem .sdot{width:8px;height:8px;border-radius:50%;flex:none}
.sitem .sy{color:var(--dim);font-size:11px;margin-left:auto}

/* ===== 视图按钮 ===== */
.viewbtns{position:fixed;right:24px;top:86px;display:flex;flex-direction:column;gap:8px;z-index:6}
.vb{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--txt);font-size:16px;cursor:pointer;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:.25s;font-family:inherit}
.vb:hover{border-color:rgba(140,160,255,.5);box-shadow:0 0 16px rgba(120,140,255,.25)}
#fitBtn{font-size:11.5px;width:auto;padding:0 12px;letter-spacing:1px}

/* ===== 名言轮播 ===== */
.quote{position:fixed;top:24px;left:50%;transform:translateX(-50%);max-width:44vw;text-align:center;pointer-events:none;z-index:5;opacity:0;transition:opacity .9s}
.quote.show{opacity:1}
.quote .q{font-family:"Kaiti SC","STKaiti","KaiTi",serif;font-size:15.5px;letter-spacing:1px;color:#cfd8ff;text-shadow:0 0 18px rgba(140,160,255,.4)}
.quote .a{font-size:11px;color:var(--dim);margin-top:5px;letter-spacing:2px}

/* ===== 详情面板 ===== */
.panel{position:fixed;top:86px;right:24px;bottom:148px;width:332px;z-index:7;background:var(--card);border:1px solid var(--line);border-radius:18px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);transform:translateX(calc(100% + 40px));transition:transform .45s cubic-bezier(.22,1.2,.36,1);padding:22px;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.panel.open{transform:none}
.panel::before{content:'';position:absolute;top:0;left:18px;right:18px;height:2px;border-radius:2px;background:linear-gradient(90deg,#ff5d73,#a78bfa,#2dd4bf);opacity:.8}
.panel::-webkit-scrollbar{width:5px}
.panel::-webkit-scrollbar-thumb{background:rgba(130,150,255,.25);border-radius:4px}
.pclose{position:absolute;top:12px;right:12px;width:28px;height:28px;border-radius:9px;border:1px solid var(--line);background:transparent;color:var(--dim);cursor:pointer;font-size:13px}
.pclose:hover{color:#fff;border-color:rgba(140,160,255,.5)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip{padding:4px 11px;border-radius:999px;font-size:11.5px;border:1px solid var(--line);color:var(--dim);background:rgba(255,255,255,.03)}
.chip.cat{color:#fff;border-color:transparent;background:linear-gradient(120deg,var(--c),transparent 230%);box-shadow:0 0 14px -4px var(--c)}
.pname{font-family:"Kaiti SC","STKaiti","KaiTi",serif;font-size:30px;letter-spacing:3px;margin-bottom:6px}
.ptag{font-size:12.5px;color:#f9a8d4;letter-spacing:1px;margin-bottom:14px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:7px 14px;font-size:13px;margin-bottom:14px}
.kv .k{color:var(--dim)}
.kv .v{color:#dbe2ff}
.pdesc{font-size:13px;line-height:1.85;color:#c9d2f2;margin-bottom:14px}
.prel-title{font-size:11.5px;color:var(--dim);margin-bottom:8px;letter-spacing:2px}
.prel{display:flex;flex-wrap:wrap;gap:7px}
.prel .chip{border-color:rgba(167,139,250,.35);color:#d5ccff}

/* ===== 时间轴 ===== */
.timeline{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;width:min(660px,calc(100vw - 40px));z-index:8;background:var(--card);border:1px solid var(--line);border-radius:18px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);padding:14px 20px 12px;box-shadow:0 18px 50px rgba(0,0,0,.45)}
.tl-top{display:flex;align-items:center;gap:10px;margin-bottom:9px}
#playBtn{padding:7px 16px;border-radius:10px;border:none;cursor:pointer;font-size:13px;color:#04101a;font-weight:600;background:linear-gradient(100deg,#2dd4bf,#22d3ee);box-shadow:0 0 18px rgba(45,212,191,.4);font-family:inherit;letter-spacing:1px}
#playBtn:hover{filter:brightness(1.12)}
#speedBtn{padding:7px 11px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--dim);cursor:pointer;font-size:12px;font-family:inherit}
#speedBtn:hover{color:#fff}
#yearLabel{font-size:26px;font-weight:800;letter-spacing:1px;margin-left:4px;background:linear-gradient(90deg,#f472b6,#a78bfa);-webkit-background-clip:text;background-clip:text;color:transparent;min-width:64px}
.tl-era{margin-left:auto;font-size:11px;color:var(--dim);letter-spacing:2px}
#yearSlider{width:100%;appearance:none;-webkit-appearance:none;height:4px;border-radius:4px;background:linear-gradient(90deg,#ff5d73,#f472b6,#a78bfa,#2dd4bf);outline:none;cursor:pointer}
#yearSlider::-webkit-slider-thumb{appearance:none;-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#fff;border:3px solid #a78bfa;box-shadow:0 0 12px rgba(167,139,250,.9);cursor:grab}
#yearSlider::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid #a78bfa;box-shadow:0 0 12px rgba(167,139,250,.9);cursor:grab}

/* ===== 提示与署名 ===== */
.hint{position:fixed;left:24px;bottom:26px;z-index:5;font-size:12px;color:#6c7497;letter-spacing:1px;pointer-events:none;animation:hintfade 1s 15s forwards}
@keyframes hintfade{to{opacity:0}}
.credit{position:fixed;right:24px;bottom:26px;z-index:5;font-size:11px;color:#4d5475;pointer-events:none;letter-spacing:1px}

@media (max-width:700px){
  .brand h1{font-size:25px}
  .legend{top:84px;left:12px}
  .search{width:168px;right:12px;top:14px}
  .quote{display:none}
  .viewbtns{top:78px;right:12px}
  .panel{top:auto;left:10px;right:10px;bottom:118px;width:auto;transform:translateY(calc(100% + 30px));max-height:52vh}
  .panel.open{transform:none}
  .hint,.credit{display:none}
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="vignette"></div>

<div class="brand">
  <h1>五代十国<small>· 乱世星图（知识图谱）</small></h1>

<div class="credit">五代十国 · 乱世星图（知识图谱） | 据《新五代史》《旧五代史》《资治通鉴》整理 · 仅供学习</div>

const nodeMap = {};
NODES.forEach((n,i)=>{
  nodeMap[n.id] = n;
  n.x = n.hx; n.y = n.hy; n.vx = 0; n.vy = 0;
  n.alpha = 0; n.target = 0; n.prevT = 0; n.deg = 0;
  n.pulse = hash(i*1.7);
});
const EDGES = EDGES_RAW.map((r,i)=>{
  const e = { s:nodeMap[r[0]], t:nodeMap[r[1]], k:r[2], y:r[3], idx:i, vis:false };
  e.s.deg++; e.t.deg++;
  const stateish = c => c==='wudai' || c==='shiguo' || c==='waibu';
  if(stateish(e.s.c) && stateish(e.t.c)) e.rest = 190;
  else if(e.s.c==='renwu' && e.t.c==='renwu') e.rest = 110;
  else if(e.s.c==='shijian' || e.t.c==='shijian') e.rest = 130;
  else e.rest = 140;
  return e;
});

/* ==================== 相机 ==================== */
const cam = { x:0, y:0, z:1 };
let camT = null;
const toScreen = n => ({ x:(n.x+cam.x)*cam.z + W/2, y:(n.y+cam.y)*cam.z + H/2 });
const toWorld = (sx,sy) => ({ x:(sx-W/2)/cam.z - cam.x, y:(sy-H/2)/cam.z - cam.y });
function zoomAt(px,py,f){
  const wz = toWorld(px,py);
  cam.z = clamp(cam.z*f, 0.25, 3.5);
  cam.x = (px-W/2)/cam.z - wz.x;
  cam.y = (py-H/2)/cam.z - wz.y;
  camT = null;
}
function fit(all){
  const list = all ? NODES : NODES.filter(n=>n.alpha>0.05);
  if(!list.length) return;
  let x1=1e9, y1=1e9, x2=-1e9, y2=-1e9;
  for(const n of list){ x1=Math.min(x1,n.x); y1=Math.min(y1,n.y); x2=Math.max(x2,n.x); y2=Math.max(y2,n.y); }
  cam.z = clamp(Math.min(W/Math.max(x2-x1,200), H/Math.max(y2-y1,200))*0.92, 0.25, 2.4);
  cam.x = -(x1+x2)/2; cam.y = -(y1+y2)/2;
  camT = null;
}

/* ==================== 交互 ==================== */
let hover = null, dragging = null, panning = null, moved = false, downX = 0, downY = 0;
function hit(x,y){
  let best = null, bd = 1e9;
  for(const n of NODES){
    if(n.alpha < 0.2) continue;
    const p = toScreen(n);
    const r = (CAT[n.c].r + Math.min(7, Math.sqrt(n.deg)*1.4)) * cam.z + 10;
    const d = Math.hypot(p.x-x, p.y-y);
    if(d < r && d < bd){ bd = d; best = n; }
  }
  return best;
}
canvas.addEventListener('pointerdown', e=>{
  const h = hit(e.clientX, e.clientY);
  moved = false; downX = e.clientX; downY = e.clientY;
  if(h){ dragging = h; canvas.classList.add('grabbing'); }
  else { panning = { x:e.clientX, y:e.clientY, cx:cam.x, cy:cam.y }; }
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove', e=>{
  if(dragging){
    if(Math.hypot(e.clientX-downX, e.clientY-downY) > 4) moved = true;
    const w = toWorld(e.clientX, e.clientY);
    dragging.x = w.x; dragging.y = w.y; dragging.vx = 0; dragging.vy = 0;
    simAlpha = Math.max(simAlpha, 0.4);
    camT = null;
  } else if(panning){
    if(Math.hypot(e.clientX-downX, e.clientY-downY) > 4) moved = true;
    cam.x = panning.cx + (e.clientX-panning.x)/cam.z;
    cam.y = panning.cy + (e.clientY-panning.y)/cam.z;
    camT = null;
  } else {
    hover = hit(e.clientX, e.clientY);
    canvas.style.cursor = hover ? 'pointer' : 'grab';
  }
});
canvas.addEventListener('pointerup', e=>{
  if(dragging && !moved) select(dragging);
  else if(panning && !moved){ closePanel(); }
  dragging = null; panning = null;
  canvas.classList.remove('grabbing');
});
canvas.addEventListener('wheel', e=>{
  e.preventDefault();
  zoomAt(e.clientX, e.clientY, e.deltaY<0 ? 1.12 : 1/1.12);
}, { passive:false });
$('#zoomIn').addEventListener('click', ()=>zoomAt(W/2, H/2, 1.25));

let simAlpha = 1;
const ripples = [];
function stepPhysics(dt){
  const dt16 = clamp(dt/16.667, 0.25, 2.5);
  const act = NODES.filter(n=>n.alpha > 0.01);
  const damp = Math.pow(0.87, dt16);
  const F = 0.06 + 0.94*simAlpha;
  simAlpha = Math.max(0.012, simAlpha*Math.pow(0.995, dt16));
  /* 斥力 + 碰撞分离 */
  for(let i=0;i<act.length;i++){
    const a = act[i];
    for(let j=i+1;j<act.length;j++){
      const b = act[j];
      let dx = b.x-a.x, dy = b.y-a.y;
      let d = Math.hypot(dx,dy);
      if(d < 0.01){ d = 0.01; dx = Math.random()-0.5; dy = Math.random()-0.5; }
      const ux = dx/d, uy = dy/d;
      const ra = CAT[a.c].r, rb = CAT[b.c].r;
      let f = 0;
      if(d < 320) f += 2600/(d*d+300) * (0.25 + 0.75*(ra+rb)/50) * F;
      const rr = ra + rb + 26;
      if(d < rr) f += (rr-d)*0.05*F;
      if(f > 0){
        const fx = ux*f, fy = uy*f;
        a.vx -= fx; a.vy -= fy; b.vx += fx; b.vy += fy;
      }
    }
  }
  /* 边弹簧 */
  for(const e of EDGES){
    if(!e.vis) continue;
    const a = e.s, b = e.t;
    const dx = b.x-a.x, dy = b.y-a.y;
    const d = Math.hypot(dx,dy) || 0.01;
    const ux = dx/d, uy = dy/d;
    let f = (d - e.rest) * 0.0022 * F;
    f = clamp(f, -1.4, 1.4);
    a.vx += ux*f; a.vy += uy*f; b.vx -= ux*f; b.vy -= uy*f;
  }
  /* 归属地锚点（拖拽中的节点除外） */
  for(const n of act){
    if(n === dragging) continue;
    n.vx += (n.hx-n.x)*0.0035*F;
    n.vy += (n.hy-n.y)*0.0035*F;
  }
  /* 积分 */
  for(const n of act){
    const v = Math.hypot(n.vx, n.vy);
    const maxV = 6*F;
    if(v > maxV){ n.vx *= maxV/v; n.vy *= maxV/v; }
    n.x += n.vx*dt16; n.y += n.vy*dt16;
  }
}
function computeEdgeVis(){
  for(const e of EDGES){
    e.vis = e.s.alpha > 0.03 && e.t.alpha > 0.03 && e.y <= year;
  }
}

/* ==================== 渲染 ==================== */
function rr(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y, x+w, y+h, r);
  ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r);
  ctx.arcTo(x, y, x+w, y, r);
  ctx.closePath();
}
const NEBULA = [
  { fx:0.18, fy:0.16, r:0.55, c:'124,58,237',  a:0.10, ph:0 },
  { fx:0.84, fy:0.78, r:0.62, c:'6,182,212',   a:0.08, ph:2.1 },
  { fx:0.62, fy:0.30, r:0.48, c:'244,114,182', a:0.05, ph:4.2 }
];
let shoot = { t0:0, next:3500, x:0, y:0, vx:0, vy:0 };
function drawBackground(now){
  const t = now/1000;
  ctx.fillStyle = '#05070f';
  ctx.fillRect(0,0,W,H);
  /* 星云 */
  ctx.globalCompositeOperation = 'lighter';
  for(const nb of NEBULA){
    const cx = W*nb.fx + Math.sin(t*0.05+nb.ph)*50;
    const cy = H*nb.fy + Math.cos(t*0.04+nb.ph)*40;
    const R = Math.min(W,H)*nb.r;
    const g = ctx.createRadialGradient(cx,cy,0,cx,cy,R);
    g.addColorStop(0, 'rgba('+nb.c+','+nb.a+')');
    g.addColorStop(1, 'rgba('+nb.c+',0)');
    ctx.fillStyle = g;
    ctx.fillRect(cx-R,cy-R,R*2,R*2);
  }
  /* 网格（视差） */
  ctx.globalCompositeOperation = 'source-over';
  ctx.strokeStyle = 'rgba(99,116,255,0.05)';
  ctx.lineWidth = 1;
  const step = 90*cam.z;
  const offX = mod(cam.x*0.3*cam.z, step), offY = mod(cam.y*0.3*cam.z, step);
  ctx.beginPath();
  for(let x=-offX; x<=W; x+=step){ ctx.moveTo(x,0); ctx.lineTo(x,H); }
  for(let y=-offY; y<=H; y+=step){ ctx.moveTo(0,y); ctx.lineTo(W,y); }
  ctx.stroke();
  /* 星星 */
  ctx.globalCompositeOperation = 'lighter';
  for(const s of stars){
    const a = 0.10 + 0.45*Math.abs(Math.sin(t*s.sp*800 + s.ph));
    ctx.fillStyle = 'rgba(200,215,255,'+a.toFixed(3)+')';
    ctx.fillRect(s.x, s.y, s.r, s.r);
  }
  /* 流星 */
  if(now > shoot.next){
    shoot = {
      t0: now,
      next: now + 7000 + Math.random()*6000,
      x: W*(0.55+Math.random()*0.45), y: H*(0.05+Math.random()*0.3),
      vx: -(320+Math.random()*260), vy: 150+Math.random()*130
    };
  }
  if(now - shoot.t0 < 900){
    const age = (now-shoot.t0)/900;
    const px = shoot.x + shoot.vx*age, py = shoot.y + shoot.vy*age;
    const g = ctx.createLinearGradient(px,py, px-shoot.vx*0.14, py-shoot.vy*0.14);
    g.addColorStop(0, 'rgba(255,255,255,'+(0.8*(1-age)).toFixed(3)+')');
    g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.strokeStyle = g; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(px,py); ctx.lineTo(px-shoot.vx*0.14, py-shoot.vy*0.14); ctx.stroke();
  }
  ctx.globalCompositeOperation = 'source-over';
}
function drawEdges(now){
  const t = now/1000;
  for(const e of EDGES){
    if(!e.vis) continue;
    const a = e.s, b = e.t;
    const pa = toScreen(a), pb = toScreen(b);
    const c1 = CAT[a.c].color, c2 = CAT[b.c].color;
    const hl = hover && (e.s===hover || e.t===hover);
    const grad = ctx.createLinearGradient(pa.x,pa.y,pb.x,pb.y);
    grad.addColorStop(0, rgba(c1, hl?0.9:0.26));
    grad.addColorStop(1, rgba(c2, hl?0.9:0.26));
    ctx.strokeStyle = grad;
    ctx.lineWidth = hl ? 2.2 : 1;
    ctx.beginPath(); ctx.moveTo(pa.x,pa.y); ctx.lineTo(pb.x,pb.y); ctx.stroke();
    /* 流动光点 */
    const ph = mod(t*0.002*(0.6+hash(e.idx*7.3)) + hash(e.idx*3.1), 1);
    const px = lerp(pa.x,pb.x,ph), py = lerp(pa.y,pb.y,ph);
    ctx.globalCompositeOperation = 'lighter';
    const g2 = ctx.createRadialGradient(px,py,0,px,py,6);
    g2.addColorStop(0, rgba(c2, 0.95)); g2.addColorStop(1, rgba(c2, 0));
    ctx.fillStyle = g2;
    ctx.beginPath(); ctx.arc(px,py,6,0,6.283); ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
    /* 悬浮时显示关系标签 */
    if(hl){
      const label = e.k+' '+b.n;
      ctx.font = '600 11.5px "PingFang SC","Microsoft YaHei",sans-serif';
      const w = ctx.measureText(label).width + 16;
      const mx = (pa.x+pb.x)/2, my = (pa.y+pb.y)/2;
      rr(mx-w/2, my-11, w, 22, 11);
      ctx.fillStyle = 'rgba(8,11,22,0.92)';
      ctx.fill();
      ctx.strokeStyle = rgba(c2, 0.55); ctx.lineWidth = 1;
      ctx.stroke();
      ctx.fillStyle = '#e8ecff';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(label, mx, my+1);
    }
  }
}
function drawNodes(now){
  const t = now/1000;
  for(const n of NODES){
    if(n.alpha <= 0.01) continue;
    const p = toScreen(n);
    const base = CAT[n.c].r + Math.min(7, Math.sqrt(n.deg)*1.3);
    const R = base*cam.z;
    const pul = 1 + 0.05*Math.sin(t*2.2 + n.pulse*6.28);
    const rrN = R*pul;
    const col = CAT[n.c].color;
    const a = n.alpha;
    const isHl = (n===hover || n===sel);
    /* 外发光 */
    ctx.globalCompositeOperation = 'lighter';
    const g1 = ctx.createRadialGradient(p.x,p.y,rrN*0.3,p.x,p.y,rrN*2.7);
    g1.addColorStop(0, rgba(col, 0.30*a));
    g1.addColorStop(1, rgba(col, 0));
    ctx.fillStyle = g1;
    ctx.beginPath(); ctx.arc(p.x,p.y,rrN*2.7,0,6.283); ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
    /* 主体 */
    ctx.beginPath(); ctx.arc(p.x,p.y,rrN,0,6.283);
    ctx.fillStyle = '#0b1020'; ctx.fill();
    const g2 = ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,rrN);
    g2.addColorStop(0, rgba(col, 0.42*a));
    g2.addColorStop(1, rgba(col, 0.05*a));
    ctx.fillStyle = g2; ctx.fill();
    /* 环 */
    ctx.strokeStyle = rgba(col, 0.95*a);
    ctx.lineWidth = isHl ? 2.2 : 1.4;
    ctx.beginPath(); ctx.arc(p.x,p.y,rrN,0,6.283); ctx.stroke();
    ctx.strokeStyle = rgba(col, 0.35*a);
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(p.x,p.y,rrN*0.62,0,6.283); ctx.stroke();
    /* 核心亮点 */
    ctx.fillStyle = rgba('#ffffff', 0.9*a);
    ctx.beginPath(); ctx.arc(p.x,p.y,rrN*0.16,0,6.283); ctx.fill();
    /* 悬浮/选中：旋转虚线环 */
    if(isHl){
      ctx.setLineDash([7,9]);
      ctx.lineDashOffset = -now/40;
      ctx.strokeStyle = rgba(col, (n===sel?0.95:0.6)*a);
      ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.arc(p.x,p.y,rrN+7,0,6.283); ctx.stroke();
      ctx.setLineDash([]);
    }
    /* 名称 */
    let showLabel = false;
    if(n.c==='wudai' || n.c==='shiguo' || n.c==='waibu') showLabel = cam.z > 0.34;
    else showLabel = isHl || cam.z > 1.35;
    if(showLabel){
      const fs = clamp(base*cam.z*0.62, 10.5, 17);
      ctx.font = '600 '+fs.toFixed(1)+'px "PingFang SC","Microsoft YaHei",sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.shadowColor = col; ctx.shadowBlur = 10;
      ctx.fillStyle = '#eaf0ff';
      ctx.fillText(n.n, p.x, p.y + rrN + 12);
      ctx.shadowBlur = 0;
    }
  }
}
function drawRipples(now){
  for(let i=ripples.length-1;i>=0;i--){
    const r = ripples[i];
    const age = (now - r.t0)/750;
    if(age >= 1){ ripples.splice(i,1); continue; }
    const p = { x:(r.x+cam.x)*cam.z + W/2, y:(r.y+cam.y)*cam.z + H/2 };
    const rad = (12 + 46*age) * cam.z;
    ctx.strokeStyle = rgba(r.c, (1-age)*0.85);
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(p.x, p.y, rad, 0, 6.283); ctx.stroke();
  }
}

/* ==================== 主循环 ==================== */
function frame(now){
  requestAnimationFrame(frame);
  const dt = Math.min(50, now - last);
  last = now;
  /* 自动播放 */
  if(playing && now >= nextTick){
    nextTick = now + SPEEDS[speedIdx];
    setYear(year+1);
    if(introStop !== null && year >= introStop){ playing = false; introStop = null; syncPlayBtn(); }
    if(year >= YMAX){ playing = false; syncPlayBtn(); }
  }
  /* 可见性与淡入淡出 */
  computeVis();
  for(const n of NODES){
    n.alpha += (n.target - n.alpha)*0.08;
    if(n.target === 1 && n.prevT !== 1){
      ripples.push({ x:n.x, y:n.y, c:CAT[n.c].color, t0:now });
    }
    n.prevT = n.target;
  }
  computeEdgeVis();
  stepPhysics(dt);
  /* 相机动画 */
  if(camT){
    cam.x = lerp(cam.x, camT.x, 0.12);
    cam.y = lerp(cam.y, camT.y, 0.12);
    cam.z = lerp(cam.z, camT.z, 0.12);
    if(Math.abs(cam.x-camT.x)<1 && Math.abs(cam.y-camT.y)<1 && Math.abs(cam.z-camT.z)<0.01) camT = null;
  }
  /* 渲染 */
  drawBackground(now);
  drawEdges(now);
  drawNodes(now);
  drawRipples(now);
}

/* ==================== 启动 ==================== */
let last = performance.now();
fit(true);
setYear(YMIN);
playing = true; introStop = 907; speedIdx = 2;
speedBtn.textContent = SPEED_LABELS[speedIdx];
syncPlayBtn();
requestAnimationFrame(frame);
})();
</script>
